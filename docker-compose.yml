# One service: the API and the built frontend on http://localhost:8000.
# Not run in the development environment of this project (Docker was not installed there).
services:
  netshield:
    build: .
    ports:
      - "8000:8000"
    environment:
      NETSHIELD_MAX_REQUEST_BYTES: "1048576"
      NETSHIELD_SIMULATION_BUDGET_MS: "10000"
      # Same origin by default, so CORS is not needed. Set allowed origins if another site calls the API.
      NETSHIELD_CORS_ORIGINS: "http://localhost:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
