<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17181B" />
    <meta name="description" content="NetShield is an educational web application for exploring computer network reliability through graph-theoretic failure simulation and discrete mathematics." />
    
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="NetShield | Graph-Theoretic Network Reliability Lab" />
    <meta property="og:description" content="Build network topologies, simulate node and connection failures, identify critical bridges and cut vertices, and estimate reliability through Monte Carlo trials." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Vector Favicon matching wordmark glyph in Charcoal, Moonlit Silver, and Signal Red -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%23E5484D' stroke-width='2' stroke-linecap='square'><rect x='5' y='5' width='6' height='6' fill='%2317181B' stroke='%23E4E8EC'/><rect x='21' y='5' width='6' height='6' fill='%2317181B' stroke='%23E4E8EC'/><rect x='13' y='21' width='6' height='6' fill='%2317181B' stroke='%23E4E8EC'/><line x1='11' y1='8' x2='21' y2='8' stroke='%23E4E8EC'/><line x1='8' y1='11' x2='13' y2='21' stroke='%23E4E8EC'/><line x1='24' y1='11' x2='19' y2='21' stroke='%23E5484D'/></svg>" />
    
    <!-- Landing route paints charcoal before any script or stylesheet loads (no theme flash). -->
    <script>
      if (location.pathname === '/') {
        document.documentElement.setAttribute('data-route', 'landing')
        // Preload the landing fonts during HTML parse, ahead of the lazy landing chunk.
        ;['cormorant-garamond-latin-500-normal', 'cormorant-garamond-latin-500-italic', 'inter-latin-wght-normal', 'jetbrains-mono-latin-500-normal'].forEach(function (f) {
          var l = document.createElement('link')
          l.rel = 'preload'
          l.as = 'font'
          l.type = 'font/woff2'
          l.crossOrigin = 'anonymous'
          l.href = '/landing-fonts/' + f + '.woff2'
          document.head.appendChild(l)
        })
      }
    </script>
    <style>html[data-route='landing'], html[data-route='landing'] body { background: #17181B; }</style>
    <title>NetShield | Network Reliability and Failure Simulation</title>
    
    <!-- Google Fonts: Cormorant Garamond (High-contrast Display Serif & Script Italic), Inter (UI Sans), JetBrains Mono (Code/Numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-bg-primary text-text-primary antialiased selection:bg-accent-teal/20 selection:text-accent-teal overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
